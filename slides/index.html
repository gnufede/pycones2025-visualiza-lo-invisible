						## Race conditions
						```python
						ready = False

						async def prepare():
							global ready
							await asyncio.sleep(0.05)
							ready = True

						@pytest.mark.asyncio
						async def test_async_ready_check():
							global ready
							ready = False
							asyncio.create_task(prepare())
							await asyncio.sleep(0.0500242)
							assert ready  # Flaky: might fail
						```

						## pytest session start
						```python
						# tests/conftest.py
						TEST_DATA = None
						def pytest_sessionstart(session):
							"""Capture session start info."""
							global TEST_DATA

							TEST_DATA = {
								"session_id": str(uuid.uuid4()),
								"session_start_time": datetime.now(UTC).isoformat(),
								"git_info": get_git_info(),
								"environment": get_environment_info(),
								"ci_info": get_ci_info(),
								"test_results": [],
							}
						```
						---
						## pytest runtest logreport
						```python
						# tests/conftest.py
						def pytest_runtest_logreport(report):
							if report.when == "call":  # Only captures test execution (no setup/teardown)
								test_result = {
									"test_fqn": report.nodeid,
									"test_name": report.nodeid.split("::")[-1],
									"test_status": report.outcome,
									"test_traceback": str(report.longrepr) if report.failed else None,
									"test_duration": report.duration,
									"test_file_path": str(getattr(report, "fspath", "None")),
									"test_line_number": report.location[1] if report.location else None,
								}
								TEST_DATA["test_results"].append(test_result)
						```

						## pytest session finish
						```python
						# tests/conftest.py

						def pytest_sessionfinish(session):
							"""Send data to CI Viz at session end."""
							end = datetime.now(UTC)
							TEST_DATA["session_end_time"] = end.isoformat()

							# Calculate total duration
							start = datetime.fromisoformat(TEST_DATA["session_start_time"])
							TEST_DATA["session_total_duration"] = (end - start).total_seconds()

							# pprint.pprint(TEST_DATA)
							send_to_ci_viz(TEST_DATA)
						```

						## Sending our data
						```python
						# tests/conftest.py
						def send_to_ci_viz(data):
							ci_viz_url = os.environ.get("CI_VIZ_URL", "http://localhost:8000")
							try:
								req = urllib.request.Request(
									f"{ci_viz_url}/api/v1/ingest-test-results/",
									data=json.dumps(data).encode("utf-8"),
									headers={"Content-Type": "application/json"}, # TODO: Authentication
									method="POST",
								)
								urllib.request.urlopen(req, timeout=30).close()
							except (urllib.error.URLError, urllib.error.HTTPError, json.JSONDecodeError):
								pass  # Don't fail the test run if backend service is unavailable
						```

						## [Dealing with tests that cannot succeed](https://docs.pytest.org/en/6.2.x/skipping.html)
						- `@pytest.mark.skip`
						- `@pytest.mark.xfail`
						---
						## Skip
						- No need to run the test
						```python
						@pytest.mark.skipif(
						    sys.version_info < (3, 7), reason="requires python3.7 or higher"
						)
						def test_function():
							...
						```
						---
						## Xfail
						- Run the test, just in case
						```python
@pytest.mark.xfail(
	sys.platform == "win32", reason="bug in a 3rd party library"
)
def test_function():
	...
						```

						## Flaky tests query (backend)
						```python
						# Find flaky tests: same test, same commit, both pass & fail
						query = """
							SELECT test_fqn,
								GROUP_CONCAT(DISTINCT test_traceback) as expected_exceptions
							FROM test_results
							WHERE git_repository_url = ? AND git_branch = ?
							GROUP BY test_fqn, git_commit_hash
							HAVING SUM(test_status = 'passed') > 0
							AND SUM(test_status = 'failed') > 0
						"""
						cursor.execute(query, (repo, 'main'))
						flaky_tests = cursor.fetchall()
						```

						@app.get("/api/v1/flaky-tests")
						def flaky_tests(repo: str, branch: str):
							tests = get_flaky_tests(repo, branch)

							# Return dict: test_fqn -> [expected_exception_messages]
							return {

						# tests/conftest.py
						FLAKY_TESTS = {}  # Dict: {test_fqn: [exceptions]}

						def pytest_sessionstart(session):
							"""Fetch problematic tests with their expected exceptions."""
							with urllib.request.urlopen(
								f"{CI_VIZ_URL}/api/v1/flaky-tests?q=repo..."
							) as r:
								data = json.load(r)
								FLAKY_TESTS.update(
									data.get("problematic_tests", {})
								)

						## Xfail approach (plugin)
						- Problem: Hides NEW bugs with different exceptions!  <!-- .element: class="fragment" data-fragment-index="1" -->
						```python
						def pytest_runtest_setup(item):
							"""Mark flaky tests as expected failures before they run."""
							if item.nodeid in FLAKY_TESTS.keys():
								xfail_marker = pytest.mark.xfail(
									reason="Test detected as flaky",
									strict=False,  # Allows the test to pass
							        # raises=RuntimeError,  # FIXME
								)
								item.add_marker(xfail_marker)
						```
						---
						## makereport approach (plugin)
						```python
						def pytest_runtest_makereport(item, call):
							if call.when != "call" or not call.excinfo:
								return

							expected = FLAKY_TESTS.get(item.nodeid, [])
							actual = str(call.excinfo.getrepr())

							# Only mark xfail if exception matches
							if any(exp in actual for exp in expected):
								call.excinfo = None
								call.wasxfail = "Known flaky exception"
							# Different exception? Let it fail! (real bug)
						```
