						## pytest session start
						```python
						# tests/conftest.py
						TEST_DATA = None
						def pytest_sessionstart(session):
							"""Capture session start info."""
							global TEST_DATA

							TEST_DATA = {
								"session_id": str(uuid.uuid4()),
								"session_start_time": datetime.now(UTC).isoformat(),
								"git_info": get_git_info(),
								"environment": get_environment_info(),
								"ci_info": get_ci_info(),
								"test_results": [],
							}
						```
						---
						## pytest runtest logreport
						```python
						# tests/conftest.py
						def pytest_runtest_logreport(report):
							if report.when == "call":  # Only captures test execution (no setup/teardown)
								test_result = {
									"test_fqn": report.nodeid,
									"test_name": report.nodeid.split("::")[-1],
									"test_status": report.outcome,
									"test_traceback": str(report.longrepr) if report.failed else None,
									"test_duration": report.duration,
									"test_file_path": str(getattr(report, "fspath", "None")),
									"test_line_number": report.location[1] if report.location else None,
								}
								TEST_DATA["test_results"].append(test_result)
						```
						---
						## pytest session finish
						```python
						# tests/conftest.py

						def pytest_sessionfinish(session):
							"""Send data to CI Viz at session end."""
							end = datetime.now(UTC)
							TEST_DATA["session_end_time"] = end.isoformat()

							# Calculate total duration
							start = datetime.fromisoformat(TEST_DATA["session_start_time"])
							TEST_DATA["session_total_duration"] = (end - start).total_seconds()

							# pprint.pprint(TEST_DATA)
							send_to_ci_viz(TEST_DATA)
						```

						## Sending our data
						```python
						# tests/conftest.py
						def send_to_ci_viz(data):
							ci_viz_url = os.environ.get("CI_VIZ_URL", "http://localhost:8000")
							try:
								req = urllib.request.Request(
									f"{ci_viz_url}/api/v1/ingest-test-results/",
									data=json.dumps(data).encode("utf-8"),
									headers={"Content-Type": "application/json"}, # TODO: Authentication
									method="POST",
								)
								urllib.request.urlopen(req, timeout=30).close()
							except (urllib.error.URLError, urllib.error.HTTPError, json.JSONDecodeError):
								pass  # Don't fail the test run if backend service is unavailable
						```

						@app.post("/api/v1/ingest-test-results/")
						async def ingest_test_results(test_results: list[TestResult]):
							try:
								conn = sqlite3.connect(DB_PATH)
								cursor = conn.cursor()
								for test_result in test_results:
									cursor.execute(
										"""
										INSERT INTO test_results (
											test_id, test_name, test_fqn, test_status, ...
											) VALUES (?, ?, ?, ?, ?, ... )
										""", (test_result.test_id, test_result.test_name, ...)
								conn.commit()
								conn.close()

						## Closing the loop (backend)
						```python
						@app.get("/api/v1/flaky-tests")
						def flaky_tests(repo: str):
							q = """SELECT test_fqn FROM test_results
						    WHERE git_repository_url = ? AND git_branch = main
							GROUP BY test_fqn, git_commit_hash
							HAVING SUM(status='failed') > 0 AND SUM(status='passed') > 0
							"""
							cursor.execute(q, (repo,))
							flaky_tests = [r[0] for r in cursor.fetchall()]
							return {"flaky_test_fqns": flaky_tests}
						```

						## Closing the loop (conftest) II
						```python
						def fetch_flaky_tests():
							if not (git := get_git_info()) or not git.get("git_repo"): return
							try:
								q = urllib.parse.urlencode({
									"git_repo": git["git_repository_url"]
								})
								with urllib.request.urlopen(
						            f"{CI_VIZ_URL}/api/v1/flaky-tests?{q}", timeout=10
								) as r:
									if r.status == 200:
										FLAKY_TESTS.update(
											json.load(r).get("flaky_test_fqns", [])
										)
							except Exception: pass
						```
						---
						## Closing the loop (conftest) III
						```python
						# tests/conftest.py

						def pytest_runtest_setup(item):
							"""Mark flaky tests as expected failures before they run."""
							if item.nodeid in FLAKY_TESTS:
								xfail_marker = pytest.mark.xfail(
									reason="Test detected as flaky",
									strict=False,  # Allows the test to pass
								)
								item.add_marker(xfail_marker)
						```
