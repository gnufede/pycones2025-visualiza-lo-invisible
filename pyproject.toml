[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ci-viz-simple"
version = "0.1.0"
description = "Simple CI test visibility system for tracking test failure patterns"
authors = [{name = "Federico Mon", email = "federico.mon@datadoghq.com"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "jinja2",
    "aiofiles",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ci_viz_simple"]

[tool.hatch.envs.default]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pytest>=7.4.0",
]

[tool.hatch.envs.dev]
dependencies = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
]

[project.scripts]
ci-viz = "ci_viz_simple.main:main"
ci-viz-load-fixtures = "ci_viz_simple.fixtures:load_fixtures_cli"
